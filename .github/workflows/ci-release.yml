name: CI & Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 📱 Build, Test & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔑 Permissão de Execução para o Gradle Wrapper
        run: chmod +x gradlew

      - name: 🧪 Executar Testes Unitários
        run: ./gradlew test --stacktrace

      - name: 🔨 Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: 🔨 Compilar APK Release
        run: ./gradlew assembleRelease --stacktrace || true

      - name: 📦 Organizar Artefatos de APK
        id: prepare_apks
        run: |
          mkdir -p build-artifacts
          # Debug APK (Instalável de imediato em qualquer smartphone Android)
          if ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/debug/*.apk build-artifacts/kraken-mobile-debug.apk
          fi
          # Release APK (se gerado)
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk build-artifacts/
          fi
          echo "=== Artefatos Preparados para Publicação ==="
          ls -lh build-artifacts/

      - name: 📤 Upload Artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: kraken-mobile-apks
          path: build-artifacts/*

      - name: 🏷️ Publicar GitHub Release com APK
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.2.0-b{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Kraken Mobile {0}', github.ref_name) || format('Kraken Mobile v0.2.0 (Build {0})', github.run_number) }}
          files: build-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
