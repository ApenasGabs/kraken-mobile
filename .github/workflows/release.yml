name: 🚀 Release Kraken Mobile APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 📱 Build & Publish APK Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔑 Permissões do gradlew
        run: chmod +x gradlew

      - name: 🧪 Executar Testes Unitários
        run: ./gradlew test --stacktrace

      - name: 🔨 Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: 📦 Preparar Artefatos
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/kraken-mobile-debug.apk

      - name: 🏷️ Criar GitHub Release e Anexar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ github.run_number }}
          name: "Kraken Mobile v0.1.0-${{ github.run_number }}"
          files: dist/kraken-mobile-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
